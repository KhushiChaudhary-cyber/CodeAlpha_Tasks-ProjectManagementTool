<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Task - ProjectFlow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>ProjectFlow</h1>
        <span>Project Management Tool</span>
    </div>

    <div class="container">

        <a href="{% url 'project_detail' project.id %}" class="back">
            ← Back to Project
        </a>

        <div class="form-card">

            <h2>Create Task</h2>

            <p>
                Project: <strong>{{ project.name }}</strong>
            </p>

            <form method="POST">

                {% csrf_token %}

                <!-- Task Title -->
                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                        required
                    >

                </div>

                <!-- Description -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the task"
                    ></textarea>

                </div>

                <!-- Assign To -->
                <div class="form-group">

                    <label for="assigned_to">
                        Assign To
                    </label>

                    <select
                        id="assigned_to"
                        name="assigned_to"
                    >

                        <option value="">
                            Unassigned
                        </option>

                        {% for user in users %}

                            <option value="{{ user.id }}">
                                {{ user.username }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Status -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                    >

                        <option value="TODO">
                            To Do
                        </option>

                        <option value="IN_PROGRESS">
                            In Progress
                        </option>

                        <option value="DONE">
                            Done
                        </option>

                    </select>

                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="btn"
                >
                    Create Task
                </button>

            </form>

        </div>

    </div>

</body>

</html>
